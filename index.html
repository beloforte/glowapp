<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6C3CE1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Glow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌟</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:#0D0D1A;color:#F0F0FF;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none}
input,textarea,select{font-family:inherit;outline:none}
img{max-width:100%;display:block}
a{color:#8B5CF6;text-decoration:none}
:root{--pri:#6C3CE1;--pri2:#8B5CF6;--ok:#00C897;--warn:#FF9800;--danger:#FF4757;--acc:#FFD93D;--card:#1A1A2E;--dim:#8888AA;--border:rgba(255,255,255,.08);--r:14px;--rl:20px}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.page{padding:16px;padding-bottom:100px;animation:fadeIn .3s ease}
.topbar{position:sticky;top:0;z-index:100;background:rgba(13,13,26,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.topbar-back{display:flex;align-items:center;gap:8px;color:#F0F0FF;font-size:16px}
.logo{display:flex;align-items:center;gap:8px}
.logo-i{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-t{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:100;background:rgba(13,13,26,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:12px;color:var(--dim);font-size:10px;transition:all .2s}
.nav-btn.on{color:var(--pri)}
.nav-btn .ni{font-size:22px;line-height:1}
.nav-btn.center .nw{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:0 4px 20px rgba(108,60,225,.4)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;transition:border-color .3s}
.card-glow{background:linear-gradient(135deg,var(--pri),#7C3AED);border:none;border-radius:var(--rl);padding:20px;position:relative;overflow:hidden}
.card-glow:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(255,255,255,.15),transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:var(--r);font-size:15px;font-weight:600;transition:all .25s;width:100%}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 20px rgba(108,60,225,.3)}
.btn-sec{background:rgba(108,60,225,.15);color:var(--pri2);border:1px solid rgba(108,60,225,.25)}
.btn-google{background:#fff;color:#333;border:1px solid rgba(0,0,0,.1);font-weight:600}
.btn-danger{background:rgba(255,71,87,.15);color:var(--danger);border:1px solid rgba(255,71,87,.25)}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{padding:8px 16px;font-size:13px;width:auto}
.btn-ghost{background:transparent;color:var(--dim)}
.fg{margin-bottom:16px}.fl{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:500}
.fi{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--r);padding:13px 16px;color:#F0F0FF;font-size:15px;transition:border-color .25s}
.fi:focus{border-color:var(--pri);box-shadow:0 0 20px rgba(108,60,225,.2)}.fi::placeholder{color:var(--dim)}
textarea.fi{resize:vertical;min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex}.fc{flex-direction:column}.ai{align-items:center}.jb{justify-content:space-between}.jc{justify-content:center}.f1{flex:1}.fw{flex-wrap:wrap}.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}
.tc{text-align:center}.t11{font-size:11px}.t13{font-size:13px}.t18{font-size:18px}.t22{font-size:22px}.t28{font-size:28px}.t36{font-size:36px}
.fb{font-weight:700}.fs{font-weight:600}.fm{font-weight:500}
.c-dim{color:var(--dim)}.c-ok{color:var(--ok)}.c-pri{color:var(--pri)}.c-danger{color:var(--danger)}.c-acc{color:var(--acc)}.c-warn{color:var(--warn)}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt6{margin-top:24px}.mt8{margin-top:32px}
.mb1{margin-bottom:4px}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}.mb6{margin-bottom:24px}
.p3{padding:12px}.p4{padding:16px}.px4{padding-left:16px;padding-right:16px}.py2{padding-top:8px;padding-bottom:8px}
.w100{width:100%}.mxa{margin-left:auto;margin-right:auto}
.rounded{border-radius:var(--r)}.rounded2{border-radius:var(--rl)}.rounded-full{border-radius:50%}
.ovh{overflow:hidden}.lc2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hidden{display:none!important}.pointer{cursor:pointer}.mono{font-family:'SF Mono',Monaco,Consolas,monospace}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.b-ok{background:rgba(0,200,151,.15);color:var(--ok)}.b-danger{background:rgba(255,71,87,.15);color:var(--danger)}.b-warn{background:rgba(255,152,0,.15);color:var(--warn)}.b-pri{background:rgba(108,60,225,.15);color:var(--pri2)}
.prog{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.prog-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .5s}
.skel{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:shim 1.5s infinite;border-radius:var(--r)}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:var(--rl) var(--rl) 0 0;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s ease;max-height:85dvh;overflow-y:auto}
.sh-h{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 20px}
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:tin .3s ease;pointer-events:auto;display:flex;align-items:center;gap:10px}
.toast-ok{border-color:rgba(0,200,151,.3)}.toast-err{border-color:rgba(255,71,87,.3)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);border-radius:12px;padding:4px}
.tab{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:600;text-align:center;color:var(--dim);transition:all .2s}
.tab.on{background:var(--pri);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chip{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s;border:1px solid var(--border);color:var(--dim)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.upload-z{border:2px dashed rgba(255,255,255,.12);border-radius:var(--r);padding:32px 16px;text-align:center;cursor:pointer;transition:all .25s}
.upload-z:hover{border-color:var(--pri);background:rgba(108,60,225,.05)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center}
.stat-n{font-size:22px;font-weight:700}.stat-l{font-size:11px;color:var(--dim);margin-top:2px}
.rp{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.r1{background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff;box-shadow:0 4px 20px rgba(255,215,0,.3)}
.r2{background:linear-gradient(135deg,#C0C0C0,#888);color:#fff}
.r3{background:linear-gradient(135deg,#CD7F32,#8B4513);color:#fff}
.ro{background:rgba(108,60,225,.2);color:var(--pri2)}
.media-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.media-i{border-radius:10px;overflow:hidden;position:relative;aspect-ratio:1}
.media-i img{width:100%;height:100%;object-fit:cover}
.media-dl{position:absolute;bottom:0;left:0;right:0;padding:8px;background:rgba(0,0,0,.6);text-align:center;font-size:11px;font-weight:600;color:#fff;text-decoration:none}
.notif{display:flex;gap:12px;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.notif.unread{border-color:rgba(108,60,225,.3);background:rgba(108,60,225,.05)}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--pri);flex-shrink:0;margin-top:6px}
.imgv{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.imgv img{max-width:100%;max-height:90dvh;object-fit:contain;border-radius:8px}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--dim);font-size:13px}
.divider:before,.divider:after{content:'';flex:1;height:1px;background:var(--border)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes shim{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes tin{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL="https://pxyltxopwzfcjqewgwxz.supabase.co";
var SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4eWx0eG9wd3pmY2pxZXdnd3h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NzgyNTMsImV4cCI6MjEwNjI1NDI1M30.m5114dTa_K9t5CmtlkxTA97RV5jwQND2555hDoNL_h8";

function $(s){return document.querySelector(s)}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function money(n){return"R$ "+(Number(n)||0).toFixed(2).replace(".",",")}
function dateBR(d){return d?new Date(d).toLocaleDateString("pt-BR"):""}
function dtBR(d){return d?new Date(d).toLocaleString("pt-BR"):""}
function go(r){location.hash=r}

function toast(msg,type){
  type=type||"ok";var c=document.getElementById("toasts");if(!c)return;
  var t=document.createElement("div");
  t.className="toast toast-"+(type==="ok"?"ok":"err");
  t.innerHTML="<span>"+(type==="ok"?"✅":"⚠️")+"</span><span>"+esc(msg)+"</span>";
  c.appendChild(t);
  setTimeout(function(){t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(function(){t.remove()},300)},3500)
}

var sb=null,S={user:null,profile:null,step:1,email:"",name:"",campaignTab:"details",validateCampaignId:null,selectedRole:"resident"};

function loadSession(){
  return sb.auth.getSession().then(function(r){
    if(r.data&&r.data.session&&r.data.session.user){S.user=r.data.session.user;return fetchProfile().then(function(){if(!S.profile||!S.profile.name)S.step=3})}
    return null
  })
}
function fetchProfile(){if(!S.user)return Promise.resolve(null);return sb.from("profiles").select("*").eq("id",S.user.id).single().then(function(r){S.profile=r.data||null;return S.profile})}
function saveProfile(u){if(!S.user)return Promise.resolve();return sb.from("profiles").upsert(Object.assign({id:S.user.id},u)).then(function(r){if(r.error){toast(r.error.message,"err");return}return fetchProfile()})}
function logout(){return sb.auth.signOut().then(function(){S.user=null;S.profile=null;S.step=1;location.hash="#/login";render()})}
function loginGoogle(){sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.origin}})}

function handleSendCode(){
  var inp=document.getElementById("in-email");var email=((inp&&inp.value)||"").trim().toLowerCase();
  if(!email||email.indexOf("@")<0||email.indexOf(".")<0){toast("Digite um email valido","err");return}
  S.email=email;var btn=document.getElementById("btn-send");
  if(btn){btn.innerHTML='<div class="spin"></div> Enviando...';btn.disabled=true}
  sb.auth.signInWithOtp({email:email}).then(function(r){
    if(r.error){toast(r.error.message,"err");if(btn){btn.textContent="Receber codigo";btn.disabled=false}return}
    toast("Codigo enviado! Verifique seu email");S.step=2;render()
  })
}
function handleVerifyCode(){
  var code=((document.getElementById("in-code")||{}).value)||"";
  if(code.length!==6){toast("Codigo deve ter 6 digitos","err");return}
  var btn=document.getElementById("btn-verify");
  if(btn){btn.innerHTML='<div class="spin"></div> Verificando...';btn.disabled=true}
  sb.auth.verifyOtp({email:S.email,token:code,type:"email"}).then(function(r){
    if(r.error){toast(r.error.message||"Codigo invalido","err");if(btn){btn.textContent="Verificar";btn.disabled=false}return}
    S.user=r.data.user;fetchProfile().then(function(){
      if(!S.profile||!S.profile.name){S.step=3;render()}
      else{toast("Bem-vindo, "+S.profile.name+"!");go(S.profile.role==="merchant"?"#/merchant":S.profile.role==="admin"?"#/admin":"#/")}
    })
  })
}
function selectRole(role){S.selectedRole=role;var cr=document.getElementById("role-creator");var mr=document.getElementById("role-merchant");if(cr)cr.style.borderColor=role==="resident"?"var(--pri)":"var(--border)";if(mr)mr.style.borderColor=role==="merchant"?"var(--pri)":"var(--border)"}
function handleComplete(){
  var name=((document.getElementById("in-name")||{}).value)||"";
  if(!name.trim()){toast("Digite seu nome","err");return}
  saveProfile({name:name,role:S.selectedRole}).then(function(){
    toast("Bem-vindo, "+name+"!");
    go(S.selectedRole==="merchant"?"#/merchant":S.selectedRole==="admin"?"#/admin":"#/")
  })
}

function fetchCampaigns(search){
  var q=sb.from("campaigns").select("*, companies(name,city,logo_url)").eq("status","active").order("created_at",{ascending:false}).limit(30);
  if(search)q=q.ilike("title","%"+search+"%");
  return q.then(function(r){return r.data||[]})
}
function fetchCampaign(id){return sb.from("campaigns").select("*, companies(name,city,logo_url,description)").eq("id",id).single().then(function(r){return r.data})}
function fetchTransactions(){if(!S.user)return Promise.resolve([]);return sb.from("transactions").select("*").eq("user_id",S.user.id).order("created_at",{ascending:false}).limit(50).then(function(r){return r.data||[]})}
function fetchRanking(){return sb.from("posts").select("user_id,earnings,profiles(name,avatar_url,city,is_verified)").eq("status","approved").then(function(r){var m={};(r.data||[]).forEach(function(p){if(!m[p.user_id])m[p.user_id]={id:p.user_id,name:(p.profiles&&p.profiles.name)||"Criador",avatar:(p.profiles&&p.profiles.avatar_url)||"",city:(p.profiles&&p.profiles.city)||"",verified:p.profiles&&p.profiles.is_verified,posts:0,earnings:0};m[p.user_id].posts++;m[p.user_id].earnings+=Number(p.earnings)||0});return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.earnings-a.earnings})})}
function fetchNotifications(){if(!S.user)return Promise.resolve([]);return sb.from("notifications").select("*").eq("user_id",S.user.id).order("created_at",{ascending:false}).limit(50).then(function(r){return r.data||[]})}
function fetchMyCompany(){if(!S.user)return Promise.resolve(null);return sb.from("companies").select("*").eq("owner_id",S.user.id).single().then(function(r){return r.data})}
function fetchMerchantCampaigns(){return fetchMyCompany().then(function(c){if(!c)return{company:null,campaigns:[]};return sb.from("campaigns").select("*").eq("company_id",c.id).order("created_at",{ascending:false}).then(function(r){return{company:c,campaigns:r.data||[]}})})}
function fetchPendingPosts(cid){return sb.from("posts").select("*, profiles(name,avatar_url)").eq("campaign_id",cid).eq("status","pending").order("created_at").then(function(r){return r.data||[]})}
function getBalance(){if(!S.user)return Promise.resolve(0);return sb.from("transactions").select("type,amount").eq("user_id",S.user.id).eq("status","completed").then(function(r){return(r.data||[]).reduce(function(a,t){var amt=Number(t.amount)||0;return["earning","bonus","commission"].indexOf(t.type)>=0?a+amt:a-amt},0)})}
function fetchMyPosts(){if(!S.user)return Promise.resolve([]);return sb.from("posts").select("*, campaigns(title,per_post_value,companies(name))").eq("user_id",S.user.id).order("created_at",{ascending:false}).then(function(r){return r.data||[]})}
function uploadFile(file,bucket){var ext=(file.name||"f").split(".").pop();var path=Date.now()+"_"+Math.random().toString(36).slice(2,8)+"."+ext;return sb.storage.from(bucket).upload(path,file,{cacheControl:"3600"}).then(function(r){if(r.error)throw r.error;return sb.storage.from(bucket).getPublicUrl(r.data.path).data.publicUrl})}

function topBar(title){
  var isHome=location.hash==="#/"||location.hash==="";
  if(isHome){var init=(S.profile&&S.profile.name?S.profile.name.charAt(0):"U");return '<div class="topbar"><div class="logo"><div class="logo-i">🌟</div><div class="logo-t">Glow</div></div><div class="f g2 ai"><button onclick="go(\'#/notifications\')" style="font-size:20px;padding:4px">🔔</button><button onclick="go(\'#/profile\')" class="rounded-full" style="width:34px;height:34px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">'+esc(init)+'</button></div></div>'}
  return '<div class="topbar"><button onclick="history.back()" class="topbar-back">← <span class="fs">'+esc(title||"Voltar")+'</span></button><button onclick="go(\'#/notifications\')" style="font-size:20px;padding:4px">🔔</button></div>'
}

function bottomNav(){
  var hash=location.hash||"#/";
  var isMer=S.profile&&S.profile.role==="merchant";
  var isAdmin=S.profile&&S.profile.role==="admin";

  if(isAdmin){
    var ai=[
      {r:"#/admin",i:"📊",l:"Admin",on:hash==="#/admin"},
      {r:"#/admin/users",i:"👥",l:"Users",on:hash.indexOf("#/admin/users")===0},
      {r:"#/",i:"🏠",l:"Feed",on:hash==="#/"},
      {r:"#/admin/finance",i:"💰",l:"Finance",on:hash.indexOf("#/admin/finance")===0},
      {r:"#/profile",i:"👤",l:"Perfil",on:hash==="#/profile"}
    ];
    var h='<div class="nav-bottom">';
    ai.forEach(function(i){
      h+='<button class="nav-btn'+(i.on?" on":"")+'" onclick="go(\''+i.r+'\')"><span class="ni">'+i.i+'</span><span>'+i.l+'</span></button>'
    });
    return h+'</div>'
  }

  if(isMer){
    var mi=[
      {r:"#/merchant",i:"📊",l:"Painel",on:hash==="#/merchant"},
      {r:"#/merchant/campaigns",i:"📢",l:"Campanhas",on:hash.indexOf("#/merchant/campaigns")===0},
      {r:"#/merchant/campaigns/new",i:"➕",l:"",center:true},
      {r:"#/merchant/validations",i:"✅",l:"Validar",on:hash.indexOf("#/merchant/validations")===0},
      {r:"#/profile",i:"👤",l:"Perfil",on:hash==="#/profile"}
    ];
    var h='<div class="nav-bottom">';
    mi.forEach(function(i){
      if(i.center){h+='<button class="nav-btn center" onclick="go(\''+i.r+'\')"><div class="nw"><span class="ni">'+i.i+'</span></div></button>'}

function doApprove(postId){
  sb.from("posts").select("*, campaigns(per_post_value,title), user_id").eq("id",postId).single().then(function(r){

    return sb.from("posts").update({status:"approved",earnings:earnings,validated_at:new Date().toISOString()}).eq("id",postId).then(function(){
      return sb.from("transactions").insert({user_id:post.user_id,type:"earning",amount:earnings,description:'Pagamento por post',post_id:postId,status:"completed"})
    }).then(function(){
      return sb.from("notifications").insert({user_id:post.user_id,type:"post_approved",title:"Post aprovado!",message:"Voce ganhou "+money(earnings)})
    }).then(function(){toast("Post aprovado!");loadValidations()})
  })
}

    });

    if(si){var st2;si.addEventListener("input",function(){clearTimeout(st2);st2=setTimeout(function(){fetchCampaigns(si.value).then(function(list){var c=document.getElementById("list-campaigns");if(c)c.innerHTML=list.length?list.map(campaignCard).join(""):'<div class="tc" style="padding:40px"><div style="font-size:40px">🔍</div><p class="c-dim t13 mt2">Nenhuma campanha</p></div>'})},300)})}
  }
  else if(hash.indexOf("#/campaign/")===0){var id=hash.split("/")[2];app.innerHTML=renderCampaignPage(id);loadCampaign(id)}
  else if(hash==="#/wallet"){app.innerHTML=renderWallet();loadWallet()}
  else if(hash==="#/ranking"){app.innerHTML=renderRanking();loadRanking()}
  else if(hash==="#/profile"){app.innerHTML=renderProfile()}
  else if(hash==="#/my-posts"){app.innerHTML=renderMyPosts();loadMyPosts()}
  else if(hash==="#/notifications"){app.innerHTML=renderNotifications();loadNotif()}
  else if(hash==="#/merchant"){app.innerHTML=renderMerchant();loadMerchant()}
  else if(hash==="#/merchant/register"){app.innerHTML=renderMerchantReg()}
  else if(hash==="#/merchant/campaigns"){app.innerHTML=renderMerchantCampaignsList();loadMerchantCampaignsList()}
  else if(hash==="#/merchant/campaigns/new"){app.innerHTML=renderCreateCampaign()}
  else if(hash==="#/merchant/validations"){app.innerHTML=renderValidations();loadValidations()}
  else if(hash==="#/admin"||hash==="#/admin/users"||hash==="#/admin/campaigns"||hash==="#/admin/posts"||hash==="#/admin/finance"||hash==="#/admin/settings"){
    app.innerHTML='<div class="page"><div class="card-glow mb4"><div style="position:relative;z-index:1"><h2 class="t22 fb">🛡️ Painel Admin</h2><p class="t13 mt1" style="opacity:.8">Controle total da plataforma</p></div></div>';
    app.innerHTML+='<div class="f fw g2 mb4"><button class="btn btn-sec btn-sm" onclick="go(\'#/admin\')">📊 Dashboard</button><button class="btn btn-sec btn-sm" onclick="go(\'#/admin/users\')">👥 Users</button><button class="btn btn-sec btn-sm" onclick="go(\'#/admin/campaigns\')">📢 Campanhas</button><button class="btn btn-sec btn-sm" onclick="go(\'#/admin/posts\')">📝 Posts</button><button class="btn btn-sec btn-sm" onclick="go(\'#/admin/finance\')">💰 Finance</button><button class="btn btn-sec btn-sm" onclick="go(\'#/admin/settings\')">⚙️ Config</button></div>';
    app.innerHTML+='<div id="pg-admin-content"></div><div style="height:20px"></div></div>'+bottomNav();
    if(hash==="#/admin/users")loadAdminUsers();
    else if(hash==="#/admin/posts")loadAdminPosts();
    else if(hash==="#/admin/finance")loadAdminFinance();
    else if(hash==="#/admin/settings")loadAdminSettings();
    else if(hash==="#/admin/campaigns")loadAdminCampaigns();
    else loadAdmin();
  }
  else{location.hash="#/"}
}

function loadAdmin(){
  var pg=document.getElementById("pg-admin-content");if(!pg)return;
  Promise.all([sb.from("profiles").select("id,role",{count:"exact"}),sb.from("campaigns").select("id,status",{count:"exact"}),sb.from("posts").select("id,status",{count:"exact"})]).then(function(r){
    var h='<div class="stat-grid mb3"><div class="stat-box"><div class="stat-n c-pri">'+(r[0].count||0)+'</div><div class="stat-l">Usuarios</div></div><div class="stat-box"><div class="stat-n c-acc">'+(r[1].count||0)+'</div><div class="stat-l">Campanhas</div></div><div class="stat-box"><div class="stat-n c-ok">'+(r[2].count||0)+'</div><div class="stat-l">Posts</div></div></div>';
    if(pg)pg.innerHTML=h
  })
}
function loadAdminUsers(){
  var pg=document.getElementById("pg-admin-content");if(!pg)return;
  sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(50).then(function(r){
    var users=r.data||[];var h='<h3 class="fb t18 mb3">👥 Usuarios ('+users.length+')</h3><div class="f fc g2">';
    users.forEach(function(u){var rb=u.role==="admin"?"b-danger":u.role==="merchant"?"b-warn":"b-ok";
      h+='<div class="card" style="padding:12px"><div class="f ai g3"><div class="rounded-full" style="width:40px;height:40px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0">'+esc((u.name||"U").charAt(0))+'</div><div class="f1" style="min-width:0"><div class="fm t13">'+esc(u.name||"")+'</div><div class="c-dim t11">'+esc(u.email||"")+'</div></div><span class="badge '+rb+'">'+u.role+'</span></div></div>'});
    h+='</div>';if(pg)pg.innerHTML=h
  })
}
function loadAdminCampaigns(){
  var pg=document.getElementById("pg-admin-content");if(!pg)return;
  sb.from("campaigns").select("*, companies(name)").order("created_at",{ascending:false}).limit(50).then(function(r){
    var camp=r.data||[];var h='<h3 class="fb t18 mb3">📢 Campanhas ('+camp.length+')</h3><div class="f fc g2">';
    camp.forEach(function(c){h+='<div class="card" style="padding:12px"><div class="f jb ai"><div class="fs t13">'+esc(c.title)+'</div><span class="badge '+(c.status==="active"?"b-ok":"b-warn")+'">'+c.status+'</span></div></div>'});
    h+='</div>';if(pg)pg.innerHTML=h
  })
}
function loadAdminPosts(){
  var pg=document.getElementById("pg-admin-content");if(!pg)return;
  sb.from("posts").select("*, profiles(name), campaigns(title)").order("created_at",{ascending:false}).limit(50).then(function(r){
    var posts=r.data||[];var h='<h3 class="fb t18 mb3">📝 Posts ('+posts.length+')</h3><div class="f fc g2">';
    posts.forEach(function(p){var sm={approved:"b-ok",rejected:"b-danger",pending:"b-warn"};
      h+='<div class="card" style="padding:12px"><div class="f jb ai"><div><div class="fm t13">'+esc((p.profiles&&p.profiles.name)||"")+'</div><div class="c-dim t11">'+esc((p.campaigns&&p.campaigns.title)||"")+'</div></div><span class="badge '+(sm[p.status]||"b-warn")+'">'+p.status+'</span></div></div>'});
    h+='</div>';if(pg)pg.innerHTML=h
  })
}
function loadAdminFinance(){
  var pg=document.getElementById("pg-admin-content");if(!pg)return;
  sb.from("transactions").select("*, profiles(name)").order("created_at",{ascending:false}).limit(30).then(function(r){
    var txns=r.data||[];var h='<h3 class="fb t18 mb3">💰 Transacoes</h3><div class="f fc g2">';
    txns.forEach(function(t){var pos=["earning","bonus","commission"].indexOf(t.type)>=0;
      h+='<div class="card f ai g3" style="padding:12px"><div class="f1"><div class="t13 fm">'+esc(t.description||t.type)+'</div><div class="c-dim t11">'+esc((t.profiles&&t.profiles.name)||"")+'</div></div><div class="fb t13 '+(pos?"c-ok":"c-danger")+'">'+money(t.amount)+'</div></div>'});
    h+='</div>';if(pg)pg.innerHTML=h
  })
}
function loadAdminSettings(){
  var pg=document.getElementById("pg-admin-content");if(!pg)return;
  sb.from("admin_settings").select("*").single().then(function(r){
    var st=r.data||{};
    var h='<h3 class="fb t18 mb3">⚙️ Configuracoes</h3><div class="fg"><label class="fl">Comissao (%)</label><input class="fi tc" id="as-com" type="number" value="'+Math.round((st.commission_rate||0.15)*100)+'"></div><div class="grid2"><div class="fg"><label class="fl">Saque min (R$)</label><input class="fi tc" id="as-minw" type="number" value="'+(st.min_withdraw||5)+'"></div><div class="fg"><label class="fl">Saque max (R$)</label><input class="fi tc" id="as-maxw" type="number" value="'+(st.max_withdraw||5000)+'"></div></div><button class="btn btn-pri" onclick="doSaveAdminSettings(this)">Salvar</button>';
    if(pg)pg.innerHTML=h
  })
}
function doSaveAdminSettings(btn){
  btn.textContent="Salvando...";btn.disabled=true;
  sb.from("admin_settings").update({commission_rate:(((document.getElementById("as-com")||{}).value)||15)/100,min_withdraw:parseFloat(((document.getElementById("as-minw")||{}).value))||5,max_withdraw:parseFloat(((document.getElementById("as-maxw")||{}).value))||5000,updated_at:new Date().toISOString()}).limit(1).then(function(r){if(r.error){toast(r.error.message,"err");return}toast("Salvo!");btn.textContent="Salvar";btn.disabled=false})
}

document.addEventListener("input",function(e){if(e.target.id==="in-code")e.target.value=e.target.value.replace(/\D/g,"").slice(0,6)});
document.addEventListener("click",function(e){if(e.target.classList.contains("ov"))e.target.remove()});
window.addEventListener("hashchange",function(){render()});

var manifest={name:"Glow",short_name:"Glow",start_url:".",display:"standalone",background_color:"#0D0D1A",theme_color:"#6C3CE1",orientation:"portrait",icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%236C3CE1'/%3E%3Ctext x='256' y='340' font-size='280' text-anchor='middle'%3E%F0%9F%8C%9F%3C/text%3E%3C/svg%3E",sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
var ml=document.createElement("link");ml.rel="manifest";ml.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/json"}));document.head.appendChild(ml);

function boot(){
  var ok=SUPABASE_URL.indexOf("SEU_")===-1&&SUPABASE_KEY.indexOf("SUA_")===-1;
  if(typeof supabase!=="undefined"&&supabase.createClient&&ok){
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    sb.auth.onAuthStateChange(function(event,session){
      if(event==="SIGNED_IN"&&session&&session.user){S.user=session.user;if(!S.profile)fetchProfile()}
      if(event==="SIGNED_OUT"){S.user=null;S.profile=null;S.step=1;location.hash="#/login";render()}
    });
    loadSession().then(function(){render()})
  }else{render()}
}

if(typeof supabase!=="undefined"){boot()}else{window.addEventListener("load",boot)}
</script>
