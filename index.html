<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.page{padding:16px;padding-bottom:100px;animation:fadeIn .3s ease}
.topbar{position:sticky;top:0;z-index:100;background:rgba(13,13,26,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}

.logo-t{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:100;background:rgba(13,13,26,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around}

.nav-btn.on{color:var(--pri)}
.nav-btn .ni{font-size:22px;line-height:1}
.nav-btn.center .nw{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:0 4px 20px rgba(108,60,225,.4)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;transition:border-color .3s}
.card:hover{border-color:rgba(108,60,225,.25)}
.card-glow{background:linear-gradient(135deg,var(--pri),#7C3AED);border:none;border-radius:var(--rl);padding:20px;position:relative;overflow:hidden}
.card-glow:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(255,255,255,.15),transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:var(--r);font-size:15px;font-weight:600;transition:all .25s;width:100%}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed}

.btn-danger{background:rgba(255,71,87,.15);color:var(--danger);border:1px solid rgba(255,71,87,.25)}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{padding:8px 16px;font-size:13px;width:auto}
.btn-ghost{background:transparent;color:var(--dim)}
.fg{margin-bottom:16px}.fl{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:500}
.fi{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--r);padding:13px 16px;color:var(--txt);font-size:15px;transition:border-color .25s}
.fi:focus{border-color:var(--pri);box-shadow:0 0 20px rgba(108,60,225,.2)}.fi::placeholder{color:var(--dim)}
textarea.fi{resize:vertical;min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex}.fc{flex-direction:column}.ai{align-items:center}.jb{justify-content:space-between}.jc{justify-content:center}.f1{flex:1}.fw{flex-wrap:wrap}.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}
.tc{text-align:center}.t11{font-size:11px}.t13{font-size:13px}.t18{font-size:18px}.t22{font-size:22px}.t28{font-size:28px}.t36{font-size:36px}
.fb{font-weight:700}.fs{font-weight:600}.fm{font-weight:500}
.c-dim{color:var(--dim)}.c-ok{color:var(--ok)}.c-pri{color:var(--pri)}.c-danger{color:var(--danger)}.c-acc{color:var(--acc)}.c-warn{color:var(--warn)}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt6{margin-top:24px}.mt8{margin-top:32px}

.w100{width:100%}.mxa{margin-left:auto;margin-right:auto}
.rounded{border-radius:var(--r)}.rounded2{border-radius:var(--rl)}.rounded-full{border-radius:50%}
.ovh{overflow:hidden}.lc2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hidden{display:none!important}.pointer{cursor:pointer}.mono{font-family:'SF Mono',Monaco,Consolas,monospace}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.b-ok{background:rgba(0,200,151,.15);color:var(--ok)}.b-danger{background:rgba(255,71,87,.15);color:var(--danger)}.b-warn{background:rgba(255,152,0,.15);color:var(--warn)}.b-pri{background:rgba(108,60,225,.15);color:var(--pri2)}
.prog{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.prog-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .5s}
.skel{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:shim 1.5s infinite;border-radius:var(--r)}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:var(--rl) var(--rl) 0 0;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s ease;max-height:85dvh;overflow-y:auto}
.sh-h{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 20px}
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:tin .3s ease;pointer-events:auto;display:flex;align-items:center;gap:10px}
.toast-ok{border-color:rgba(0,200,151,.3)}.toast-err{border-color:rgba(255,71,87,.3)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);border-radius:12px;padding:4px}
.tab{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:600;text-align:center;color:var(--dim);transition:all .2s}
.tab.on{background:var(--pri);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chip{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s;border:1px solid var(--border);color:var(--dim)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.upload-z{border:2px dashed rgba(255,255,255,.12);border-radius:var(--r);padding:32px 16px;text-align:center;cursor:pointer;transition:all .25s}
.upload-z:hover{border-color:var(--pri);background:rgba(108,60,225,.05)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center}
.stat-n{font-size:22px;font-weight:700}.stat-l{font-size:11px;color:var(--dim);margin-top:2px}
.rp{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.r1{background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff;box-shadow:0 4px 20px rgba(255,215,0,.3)}
.r2{background:linear-gradient(135deg,#C0C0C0,#888);color:#fff}
.r3{background:linear-gradient(135deg,#CD7F32,#8B4513);color:#fff}
.ro{background:rgba(108,60,225,.2);color:var(--pri2)}
.media-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.media-i{border-radius:10px;overflow:hidden;position:relative;aspect-ratio:1}
.media-i img{width:100%;height:100%;object-fit:cover}
.media-dl{position:absolute;bottom:0;left:0;right:0;padding:8px;background:rgba(0,0,0,.6);text-align:center;font-size:11px;font-weight:600;color:#fff;text-decoration:none}
.notif{display:flex;gap:12px;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.notif.unread{border-color:rgba(108,60,225,.3);background:rgba(108,60,225,.05)}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--pri);flex-shrink:0;margin-top:6px}
.imgv{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.imgv img{max-width:100%;max-height:90dvh;object-fit:contain;border-radius:8px}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--dim);font-size:13px}
.divider:before,.divider:after{content:'';flex:1;height:1px;background:var(--border)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes shim{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes tin{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:481px){#app{box-shadow:0 0 60px rgba(0,0,0,.3)}}
</style>

<body>
<div id="app"></div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   GLOW PWA - Email + Google Login - Supabase
   ============================================================ */

// ======================== CONFIG ========================
var SUPABASE_URL = "https://pxyltxopwzfcjqewgwxz.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4eWx0eG9wd3pmY2pxZXdnd3h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NzgyNTMsImV4cCI6MjEwNjI1NDI1M30.m5114dTa_K9t5CmtlkxTA97RV5jwQND2555hDoNL_h8";

// ======================== HELPERS ========================
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function money(n) { return "R$ " + (Number(n) || 0).toFixed(2).replace(".", ","); }
function dateBR(d) { return d ? new Date(d).toLocaleDateString("pt-BR") : ""; }
function dtBR(d) { return d ? new Date(d).toLocaleString("pt-BR") : ""; }

function toast(msg, type) {
  type = type || "ok";
  var c = document.getElementById("toasts");
  if (!c) return;
  var t = document.createElement("div");
  t.className = "toast toast-" + (type === "ok" ? "ok" : "err");
  t.innerHTML = "<span>" + (type === "ok" ? "\u2705" : "\u26A0\uFE0F") + "</span><span>" + esc(msg) + "</span>";
  c.appendChild(t);
  setTimeout(function() {
    t.style.opacity = "0";
    t.style.transition = "opacity .3s";
    setTimeout(function() { t.remove(); }, 300);
  }, 3500);
}

// ======================== SUPABASE ========================
var sb = null;

// ======================== STATE ========================
var S = {
  user: null,
  profile: null,
  step: 1,
  email: "",
  name: "",
  campaignTab: "details",
  validateCampaignId: null
};

// ======================== AUTH ========================
function loadSession() {
  return sb.auth.getSession().then(function(r) {
    if (r.data && r.data.session && r.data.session.user) {
      S.user = r.data.session.user;
      return fetchProfile().then(function() {
        if (!S.profile || !S.profile.name) S.step = 3;
      });
    }
    return null;
  });
}

function fetchProfile() {
  if (!S.user) return Promise.resolve(null);
  return sb.from("profiles").select("*").eq("id", S.user.id).single().then(function(r) {
    S.profile = r.data || null;
    return S.profile;
  });
}

function saveProfile(updates) {
  if (!S.user) return Promise.resolve();
  return sb.from("profiles").upsert(Object.assign({ id: S.user.id }, updates)).then(function(r) {
    if (r.error) { toast(r.error.message, "err"); return; }
    return fetchProfile();
  });
}

function logout() {
  return sb.auth.signOut().then(function() {
    S.user = null;
    S.profile = null;
    S.step = 1;
    location.hash = "#/login";
    render();
  });
}

function loginGoogle() {
  sb.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: window.location.origin }
  });
}

function handleSendCode() {
  var input = document.getElementById("in-email");
  var email = ((input && input.value) || "").trim().toLowerCase();
  if (!email || email.indexOf("@") < 0 || email.indexOf(".") < 0) {
    toast("Digite um email valido", "err");
    return;
  }
  S.email = email;
  var btn = document.getElementById("btn-send");
  if (btn) { btn.innerHTML = '<div class="spin"></div> Enviando...'; btn.disabled = true; }

  sb.auth.signInWithOtp({ email: email }).then(function(r) {
    if (r.error) {
      toast(r.error.message, "err");
      if (btn) { btn.textContent = "Receber codigo \u2192"; btn.disabled = false; }
      return;
    }
    toast("Codigo enviado! Verifique seu email \uD83D\uDCE7");
    S.step = 2;
    render();
  });
}

function handleVerifyCode() {
  var code = ((document.getElementById("in-code") || {}).value) || "";
  if (code.length !== 6) { toast("Codigo deve ter 6 digitos", "err"); return; }
  var btn = document.getElementById("btn-verify");
  if (btn) { btn.innerHTML = '<div class="spin"></div> Verificando...'; btn.disabled = true; }

  sb.auth.verifyOtp({ email: S.email, token: code, type: "email" }).then(function(r) {
    if (r.error) {
      toast(r.error.message || "Codigo invalido", "err");
      if (btn) { btn.textContent = "Verificar \u2192"; btn.disabled = false; }
      return;
    }
    S.user = r.data.user;
    fetchProfile().then(function() {
      if (!S.profile || !S.profile.name) {
        S.step = 3;
        render();
      } else {
        toast("Bem-vindo, " + S.profile.name + "! \uD83C\uDF1F");
        go("#/");
      }
    });
  });
}

function handleComplete() {
  var name = ((document.getElementById("in-name") || {}).value) || "";
  if (!name.trim()) { toast("Digite seu nome", "err"); return; }
  S.name = name;
  saveProfile({ name: name }).then(function() {
    toast("Bem-vindo, " + name + "! \uD83C\uDF1F");
    go("#/");
  });
}

// ======================== DATA ========================
function fetchCampaigns(search) {
  var q = sb.from("campaigns").select("*, companies(name,city,logo_url)").eq("status", "active").order("created_at", { ascending: false }).limit(30);
  if (search) q = q.ilike("title", "%" + search + "%");
  return q.then(function(r) { return r.data || []; });
}

function fetchCampaign(id) {
  return sb.from("campaigns").select("*, companies(name,city,logo_url,description)").eq("id", id).single().then(function(r) { return r.data; });
}

function fetchTransactions() {
  if (!S.user) return Promise.resolve([]);
  return sb.from("transactions").select("*").eq("user_id", S.user.id).order("created_at", { ascending: false }).limit(50).then(function(r) { return r.data || []; });
}

function fetchRanking() {
  return sb.from("posts").select("user_id,earnings,profiles(name,avatar_url,city,is_verified)").eq("status", "approved").then(function(r) {
    var map = {};
    (r.data || []).forEach(function(p) {
      if (!map[p.user_id]) {
        map[p.user_id] = {
          id: p.user_id,
          name: (p.profiles && p.profiles.name) || "Criador",
          avatar: (p.profiles && p.profiles.avatar_url) || "",
          city: (p.profiles && p.profiles.city) || "",
          verified: p.profiles && p.profiles.is_verified,
          posts: 0,
          earnings: 0
        };
      }
      map[p.user_id].posts++;
      map[p.user_id].earnings += Number(p.earnings) || 0;
    });
    return Object.keys(map).map(function(k) { return map[k]; }).sort(function(a, b) { return b.earnings - a.earnings; });
  });
}

function fetchNotifications() {
  if (!S.user) return Promise.resolve([]);
  return sb.from("notifications").select("*").eq("user_id", S.user.id).order("created_at", { ascending: false }).limit(50).then(function(r) { return r.data || []; });
}

function fetchMyCompany() {
  if (!S.user) return Promise.resolve(null);
  return sb.from("companies").select("*").eq("owner_id", S.user.id).single().then(function(r) { return r.data; });
}

function fetchMerchantCampaigns() {
  return fetchMyCompany().then(function(company) {
    if (!company) return { company: null, campaigns: [] };
    return sb.from("campaigns").select("*").eq("company_id", company.id).order("created_at", { ascending: false }).then(function(r) {
      return { company: company, campaigns: r.data || [] };
    });
  });
}

function fetchPendingPosts(cid) {
  return sb.from("posts").select("*, profiles(name,avatar_url)").eq("campaign_id", cid).eq("status", "pending").order("created_at").then(function(r) { return r.data || []; });
}

function getBalance() {
  if (!S.user) return Promise.resolve(0);
  return sb.from("transactions").select("type,amount").eq("user_id", S.user.id).eq("status", "completed").then(function(r) {
    return (r.data || []).reduce(function(a, t) {
      var amt = Number(t.amount) || 0;
      return ["earning", "bonus", "commission"].indexOf(t.type) >= 0 ? a + amt : a - amt;
    }, 0);
  });
}

function fetchMyPosts() {
  if (!S.user) return Promise.resolve([]);
  return sb.from("posts").select("*, campaigns(title,per_post_value,companies(name))").eq("user_id", S.user.id).order("created_at", { ascending: false }).then(function(r) { return r.data || []; });
}

function uploadFile(file, bucket) {
  var ext = (file.name || "f").split(".").pop();
  var path = Date.now() + "_" + Math.random().toString(36).slice(2, 8) + "." + ext;
  return sb.storage.from(bucket).upload(path, file, { cacheControl: "3600" }).then(function(r) {
    if (r.error) throw r.error;
    return sb.storage.from(bucket).getPublicUrl(r.data.path).data.publicUrl;
  });
}

function go(route) { location.hash = route; }

// ======================== SETUP ========================
function renderSetup() {
  return '<div class="page tc" style="padding-top:80px">' +
    '<div class="logo-i mxa" style="width:72px;height:72px;border-radius:20px;font-size:36px">\uD83C\uDF1F</div>' +
    '<h1 class="t28 fb mt4">Glow</h1>' +
    '<p class="c-dim mt2">Configuracao Necessaria</p>' +
    '<div class="card mt8" style="text-align:left">' +
    '<h3 class="fb t18 mb2">Configure o Supabase</h3>' +
    '<p class="c-dim t13 mb2">Edite o index.html e substitua:</p>' +
    '<pre class="mono c-pri t13 mb2" style="background:rgba(108,60,225,.1);padding:12px;border-radius:10px;overflow-x:auto">var SUPABASE_URL = "https://xxx.supabase.co";<br>var SUPABASE_KEY = "eyJ...";</pre>' +

          campaign.hashtags.split(/[\s,]+/).filter(Boolean).forEach(function(t) {

      header += '<div class="f ai g2 mt2">';
      header += '<div class="rounded-full" style="width:32px;height:32px;background:rgba(108,60,225,.2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--pri)">' + esc((comp.name || "?").charAt(0)) + '</div>';
      header += '<div><div class="fm t13">' + esc(comp.name || "") + '</div>';
      if (comp.city) header += '<div class="c-dim t11">' + esc(comp.city) + '</div>';
      header += '</div></div></div>';
      header += '<div class="tc" style="background:rgba(0,200,151,.12);border-radius:12px;padding:10px 16px"><div class="c-dim t11">Por post</div><div class="c-ok fb" style="font-size:20px">' + money(campaign.per_post_value) + '</div></div></div>';

      // Tabs
      header += '<div class="tabs mb4">';
      header += '<div class="tab' + (tab === "details" ? " on" : "") + '" onclick="S.campaignTab=\'details\';render()">Detalhes</div>';

      header += '<div class="tab' + (tab === "submit" ? " on" : "") + '" onclick="S.campaignTab=\'submit\';render()">Enviar</div>';
      header += '</div>';

      pg.innerHTML = header + tc + '<div style="height:20px"></div>';
    });
  });

// ======================== PROOF ========================
var proofFile = null;

function previewProof(input) {
  var file = input.files[0];
  if (!file) return;
  proofFile = file;
  var p = document.getElementById("proof-prev");
  if (!p) return;
  p.classList.remove("hidden");
  var html = '<div style="position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border)">';
  html += '<img src="' + URL.createObjectURL(file) + '" style="width:100%;max-height:250px;object-contain;background:rgba(0,0,0,.2)">';
  html += '<button onclick="clearProof()" style="position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--danger);color:#fff;font-size:12px">\u2715</button>';
  html += '</div><p class="c-dim t11 mt1">' + esc(file.name) + ' \u00B7 ' + (file.size / 1024 / 1024).toFixed(1) + 'MB</p>';
  p.innerHTML = html;
}

function clearProof() {
  proofFile = null;
  var p = document.getElementById("proof-prev");
  if (p) { p.classList.add("hidden"); p.innerHTML = ""; }
  var i = document.getElementById("in-proof");
  if (i) i.value = "";
}

function submitProof(campaignId) {
  var btn = document.getElementById("btn-submit");
  if (!proofFile) { toast("Envie o print da publicacao", "err"); return; }
  btn.textContent = "Enviando...";
  btn.disabled = true;

  uploadFile(proofFile, "proofs").then(function(url) {
    var coupon = "GLOW-" + Math.random().toString(36).slice(2, 8).toUpperCase();
    return sb.from("posts").insert({
      campaign_id: campaignId,
      user_id: S.user.id,
      coupon_code: coupon,
      screenshot_url: url,
      post_url: ((document.getElementById("in-url") || {}).value) || "",
      caption: ((document.getElementById("in-caption") || {}).value) || "",
      platform: "instagram"
    });
  }).then(function(r) {
    if (r.error) throw r.error;
    return sb.from("campaigns").select("current_posts,company_id").eq("id", campaignId).single().then(function(c) {
      return sb.from("campaigns").update({ current_posts: ((c.data && c.data.current_posts) || 0) + 1 }).eq("id", campaignId);
    });
  }).then(function() {
    toast("Comprovacao enviada! \uD83C\uDF89");
    S.campaignTab = "submit";
    loadCampaign(campaignId);
  }).catch(function(e) {
    toast(e.message || "Erro ao enviar", "err");
    btn.textContent = "Enviar Comprovacao";
    btn.disabled = false;
  });
}

function renderWallet() {

function loadWallet() {
  Promise.all([getBalance(), fetchTransactions()]).then(function(r) {
    var balance = r[0];
    var txns = r[1];
    var pending = txns.filter(function(t) { return t.status === "pending"; }).reduce(function(a, t) { return a + (Number(t.amount) || 0); }, 0);
    var earned = txns.filter(function(t) { return ["earning", "bonus", "commission"].indexOf(t.type) >= 0 && t.status === "completed"; }).reduce(function(a, t) { return a + (Number(t.amount) || 0); }, 0);
    var withdrawn = txns.filter(function(t) { return t.type === "withdrawal" && t.status === "completed"; }).reduce(function(a, t) { return a + (Number(t.amount) || 0); }, 0);

    var pg = document.getElementById("pg-wallet");
    if (!pg) return;

    var h = '<div class="card-glow mb4"><div style="position:relative;z-index:1">';
    h += '<div class="f ai jb"><div><p class="t13" style="opacity:.7">Saldo disponivel</p><div style="font-size:38px;font-weight:700">' + money(balance) + '</div></div>';
    h += '<div class="rounded-full" style="width:48px;height:48px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:24px">\uD83D\uDCB3</div></div>';
    h += '<div class="f g2 mt4">';
    h += '<div class="f1" style="background:rgba(255,255,255,.1);border-radius:12px;padding:12px"><div class="t11" style="opacity:.6">Ganho</div><div class="fs t13">' + money(earned) + '</div></div>';
    h += '<div class="f1" style="background:rgba(255,255,255,.1);border-radius:12px;padding:12px"><div class="t11" style="opacity:.6">Sacado</div><div class="fs t13">' + money(withdrawn) + '</div></div>';
    h += '<div class="f1" style="background:rgba(255,255,255,.1);border-radius:12px;padding:12px"><div class="t11" style="opacity:.6">Pendente</div><div class="fs t13">' + money(pending) + '</div></div>';
    h += '</div></div></div>';
    h += '<div class="f g3 mb4">';
    h += '<button class="btn btn-pri" onclick="openWithdraw(' + balance + ')">Sacar</button>';
    h += '<button class="btn btn-sec" onclick="openPix()">Chave Pix</button>';
    h += '</div>';
    h += '<h3 class="fb t18 mb3">Historico</h3>';

    if (txns.length === 0) {
      h += '<div class="tc" style="padding:40px"><div style="font-size:40px">\uD83D\uDCB3</div><p class="c-dim t13 mt2">Nenhuma transacao ainda</p></div>';
    } else {
      txns.forEach(function(t) {
        var icons = { earning: "\uD83D\uDCB0", withdrawal: "\uD83D\uDCB8", bonus: "\uD83C\uDF81", commission: "\uD83D\uDCC8", fee: "\uD83D\uDCCB" };

function openWithdraw(balance) {

  });

function doWithdraw(balance) {
  var input = document.getElementById("in-withdraw");
  var amt = parseFloat(input ? input.value : 0);
  if (!amt || amt < 5) { toast("Minimo R$ 5,00", "err"); return; }
  if (amt > balance) { toast("Saldo insuficiente", "err"); return; }
  sb.from("transactions").insert({
    user_id: S.user.id,
    type: "withdrawal",
    amount: -amt,
    description: "Saque via Pix",
    status: "pending"
  }).then(function(r) {
    if (r.error) { toast(r.error.message, "err"); return; }
    toast("Saque solicitado!");
    var ov = document.querySelector(".ov");
    if (ov) ov.remove();
    loadWallet();
  });
}

    var totalPosts = rankings.reduce(function(a, r) { return a + r.posts; }, 0);

    var h = '<div class="card mb4"><div class="stat-grid">';
    h += '<div><div class="c-pri t22 fb">' + rankings.length + '</div><div class="c-dim t11">Criadores</div></div>';

      h += '</div></div>';
    }

    h += '<div class="f fc g2">';

      var pos = i + 1;
      var cls = pos === 1 ? "r1" : pos === 2 ? "r2" : pos === 3 ? "r3" : "ro";
      var medal = pos === 1 ? "\uD83E\uDD47" : pos === 2 ? "\uD83E\uDD48" : pos === 3 ? "\uD83E\uDD49" : String(pos);

      h += '<div class="card f ai g3" style="padding:12px">';

      if (r.verified) h += '<span style="font-size:12px">\u2705</span>';
      h += '</div><div class="c-dim t11">' + r.posts + ' posts' + (r.city ? ' \u00B7 ' + esc(r.city) : '') + '</div></div>';
      h += '<div class="tc"><div class="c-ok fb t13">' + money(r.earnings) + '</div></div></div>';
    });

    if (rankings.length === 0) {
      h += '<div class="tc" style="padding:40px"><div style="font-size:40px">\uD83C\uDFC6</div><p class="c-dim t13 mt2">Seja o primeiro!</p></div>';

    '<button class="btn btn-pri t18 mt4" type="submit">Salvar Empresa</button></form><div style="height:20px"></div></div>' + bottomNav();
}

function saveCompany(e) {
  e.preventDefault();
  var data = {
    owner_id: S.user.id,
    name: ((document.getElementById("co-name") || {}).value) || "",
    description: ((document.getElementById("co-desc") || {}).value) || "",
    category: ((document.getElementById("co-cat") || {}).value) || "",
    phone: ((document.getElementById("co-phone") || {}).value) || "",
    city: ((document.getElementById("co-city") || {}).value) || "",
    state: ((document.getElementById("co-state") || {}).value) || "",
    instagram: (((document.getElementById("co-ig") || {}).value) || "").replace("@", ""),
    whatsapp: ((document.getElementById("co-wa") || {}).value) || ""
  };
  fetchMyCompany().then(function(company) {
    if (company) return sb.from("companies").update(data).eq("id", company.id);
    return sb.from("companies").insert(data).then(function() {
      return sb.from("profiles").update({ role: "merchant" }).eq("id", S.user.id);
    });
  }).then(function(r) {
    if (r && r.error) { toast(r.error.message, "err"); return; }
    toast("Empresa salva!");
    fetchProfile().then(function() { go("#/merchant"); });
  });
}

// ======================== CREATE CAMPAIGN ========================
function renderCreateCampaign() {
  return topBar("Nova Campanha") + '<div class="page"><form onsubmit="createCampaign(event)">' +
    '<div class="fg"><label class="fl">Titulo *</label><input class="fi" id="ca-title" required placeholder="Ex: Divulgue nossa promocao!"></div>' +
    '<div class="fg"><label class="fl">Descricao</label><textarea class="fi" id="ca-desc" rows="3" placeholder="Descreva a campanha..."></textarea></div>' +
    '<div class="fg"><label class="fl">Instrucoes</label><textarea class="fi" id="ca-inst" rows="3" placeholder="1. Baixe a arte 2. Publique 3. Envie o print..."></textarea></div>' +
    '<div class="fg"><label class="fl">Artes e Videos</label><div class="upload-z" onclick="document.getElementById(\'in-media\').click()"><div style="font-size:28px">\uD83D\uDCE4</div><p class="t13 mt1">Toque para enviar</p><input type="file" id="in-media" accept="image/*,video/*" multiple style="display:none" onchange="previewMedia(this)"></div><div id="media-prev" class="f fw g2 mt2"></div></div>' +
    '<div class="grid2"><div class="fg"><label class="fl">Valor/Post *</label><input class="fi tc" id="ca-value" type="number" step="0.50" min="1" required placeholder="10.00"></div><div class="fg"><label class="fl">Total posts</label><input class="fi tc" id="ca-total" type="number" min="1" value="50"></div></div>' +
    '<div class="grid2"><div class="fg"><label class="fl">Posts/criador</label><input class="fi tc" id="ca-per-user" type="number" min="1" value="1"></div><div class="fg"><label class="fl">Encerra em</label><input class="fi" id="ca-end" type="date"></div></div>' +
    '<div class="fg"><label class="fl">Hashtags</label><input class="fi" id="ca-tags" placeholder="#promocao"></div>' +
    '<div class="card mb4" style="background:rgba(108,60,225,.06);border-color:rgba(108,60,225,.2)"><div class="f jb ai"><div><div class="c-dim t11">Investimento</div><div class="c-pri t22 fb" id="ca-cost">R$ 0,00</div></div><div class="tc"><div class="c-dim t11">Por post</div><div class="c-ok fb" id="ca-per">R$ 0,00</div></div></div></div>' +
    '<button class="btn btn-pri t18" type="submit">Criar Campanha</button></form><div style="height:20px"></div></div>' + bottomNav();
}

var caFiles = [];

function previewMedia(input) {
  var prev = document.getElementById("media-prev");
  for (var i = 0; i < input.files.length; i++) {
    caFiles.push(input.files[i]);
    prev.insertAdjacentHTML("beforeend", '<div style="position:relative;width:60px;height:60px;border-radius:8px;overflow:hidden"><img src="' + URL.createObjectURL(input.files[i]) + '" style="width:100%;height:100%;object-cover"></div>');
  }
  toast(input.files.length + " arquivo(s)!");
}

function createCampaign(e) {
  e.preventDefault();
  var btn = e.target.querySelector("button[type=submit]");
  btn.textContent = "Criando...";
  btn.disabled = true;

  fetchMyCompany().then(function(company) {
    if (!company) {
      toast("Cadastre empresa primeiro", "err");
      btn.textContent = "Criar Campanha";
      btn.disabled = false;
      return Promise.reject();
    }
    return Promise.all(caFiles.map(function(f) {
      return uploadFile(f, "media").catch(function() { return ""; });
    })).then(function(urls) {
      return sb.from("campaigns").insert({
        company_id: company.id,
        title: ((document.getElementById("ca-title") || {}).value) || "",
        description: ((document.getElementById("ca-desc") || {}).value) || "",
        instructions: ((document.getElementById("ca-inst") || {}).value) || "",
        hashtags: ((document.getElementById("ca-tags") || {}).value) || "",
        per_post_value: parseFloat(((document.getElementById("ca-value") || {}).value)) || 5,
        total_posts_allowed: parseInt(((document.getElementById("ca-total") || {}).value)) || 50,
        max_posts_per_creator: parseInt(((document.getElementById("ca-per-user") || {}).value)) || 1,
        end_date: ((document.getElementById("ca-end") || {}).value) ? new Date(document.getElementById("ca-end").value).toISOString() : null,
        media_urls: urls.filter(Boolean)
      });
    });
  }).then(function(r) {
    if (r && r.error) {
      toast(r.error.message, "err");
      btn.textContent = "Criar Campanha";
      btn.disabled = false;
      return;
    }
    toast("Campanha criada!");
    caFiles = [];
    go("#/merchant/campaigns");
  }).catch(function() {});
}

// ======================== VALIDATIONS ========================
function renderValidations() {
  return topBar("Validacoes") + '<div class="page" id="pg-val"><div class="skel" style="height:200px"></div></div>' + bottomNav();
}

function loadValidations() {
  fetchMerchantCampaigns().then(function(r) {
    var pg = document.getElementById("pg-val");
    if (!pg) return;
    if (!r.company || r.campaigns.length === 0) {
      pg.innerHTML = '<div class="tc" style="padding:60px"><div style="font-size:48px">\u2705</div><h3 class="t18 fb mt3">Nenhuma campanha</h3></div>';
      return;
    }

    var selId = S.validateCampaignId || r.campaigns[0].id;
    S.validateCampaignId = selId;

    fetchPendingPosts(selId).then(function(posts) {
      var h = '<div class="chips mb4">';
      r.campaigns.forEach(function(c) {
        h += '<div class="chip' + (c.id === selId ? " on" : "") + '" onclick="S.validateCampaignId=\'' + c.id + '\';loadValidations()">' + esc(c.title) + '</div>';
      });
      h += '</div><div class="f fc g3">';

      if (posts.length === 0) {
        h += '<div class="tc" style="padding:60px 0"><div style="font-size:48px">\u2705</div><h3 class="t18 fb mt3">Nenhuma comprovacao pendente</h3><p class="c-dim t13 mt2">Tudo validado!</p></div>';
      } else {
        posts.forEach(function(p) {
          h += '<div class="card ovh"><div class="f ai g3 p3">';
          h += '<div class="rounded-full" style="width:36px;height:36px;background:rgba(108,60,225,.2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--pri)">' + esc(((p.profiles && p.profiles.name) || "?").charAt(0)) + '</div>';
          h += '<div class="f1"><div class="fm t13">' + esc((p.profiles && p.profiles.name) || "") + '</div><div class="c-dim t11">' + esc(p.platform) + ' \u00B7 ' + dateBR(p.created_at) + '</div></div>';
          h += '<span class="badge b-warn">\u23F3</span></div>';
          if (p.screenshot_url) h += '<img src="' + esc(p.screenshot_url) + '" style="width:100%;max-height:300px;object-fit:contain;background:rgba(0,0,0,.2)" onclick="showImg(\'' + esc(p.screenshot_url) + '\')" class="pointer">';
          if (p.post_url) h += '<div class="px4 py2"><a href="' + esc(p.post_url) + '" target="_blank" class="c-pri t11">Ver post original</a></div>';
          if (p.caption) h += '<div class="px4 pb2"><div class="c-dim t11" style="background:rgba(255,255,255,.04);border-radius:8px;padding:8px">' + esc(p.caption) + '</div></div>';
          h += '<div class="f g2 p3"><button class="btn btn-danger btn-sm f1" onclick="doReject(\'' + p.id + '\')">Rejeitar</button><button class="btn btn-ok btn-sm f1" onclick="doApprove(\'' + p.id + '\')">Aprovar</button></div></div>';
        });
      }
      h += '</div><div style="height:20px"></div>';
      pg.innerHTML = h;
    });
  });
}

function doApprove(postId) {
  sb.from("posts").select("*, campaigns(per_post_value,title), user_id").eq("id", postId).single().then(function(r) {
    if (!r.data) return;
    var post = r.data;
    var earnings = Number(post.campaigns && post.campaigns.per_post_value) || 5;

    return sb.from("posts").update({ status: "approved", earnings: earnings, validated_at: new Date().toISOString() }).eq("id", postId).then(function() {
      return sb.from("transactions").insert({
        user_id: post.user_id,
        type: "earning",
        amount: earnings,
        description: 'Pagamento por post em "' + ((post.campaigns && post.campaigns.title) || "") + '"',
        post_id: postId,
        status: "completed"
      });
    }).then(function() {
      return sb.from("profiles").select("total_earned").eq("id", post.user_id).single();
    }).then(function(pr) {
      return sb.from("profiles").update({ total_earned: ((pr.data && pr.data.total_earned) || 0) + earnings }).eq("id", post.user_id);
    }).then(function() {
      return sb.from("campaigns").select("approved_posts").eq("id", post.campaign_id).single();
    }).then(function(ca) {
      return sb.from("campaigns").update({ approved_posts: ((ca.data && ca.data.approved_posts) || 0) + 1 }).eq("id", post.campaign_id);
    }).then(function() {
      return sb.from("notifications").insert({
        user_id: post.user_id,
        type: "post_approved",
        title: "Post aprovado!",
        message: "Voce ganhou " + money(earnings)
      });
    }).then(function() {
      toast("Post aprovado!");
      loadValidations();
    });
  });
}

function doReject(postId) {
  var reason = prompt("Motivo da rejeicao:");
  if (!reason) return;
  sb.from("posts").update({ status: "rejected", rejection_reason: reason, validated_at: new Date().toISOString() }).eq("id", postId).then(function() {
    return sb.from("posts").select("user_id").eq("id", postId).single();
  }).then(function(r) {
    return sb.from("notifications").insert({
      user_id: (r.data && r.data.user_id) || "",
      type: "post_rejected",
      title: "Post rejeitado",
      message: "Motivo: " + reason
    });
  }).then(function() {
    toast("Post rejeitado");
    loadValidations();
  });
}

function showImg(url) {
  document.body.insertAdjacentHTML("beforeend", '<div class="imgv" onclick="this.remove()"><img src="' + esc(url) + '"></div>');
}

// ======================== MERCHANT CAMPAIGNS LIST ========================
function renderMerchantCampaignsList() {
  return topBar("Campanhas") + '<div class="page" id="pg-mc"><button class="btn btn-pri mb4" onclick="go(\'#/merchant/campaigns/new\')">Nova Campanha</button><div class="skel" style="height:200px"></div></div>' + bottomNav();
}

function loadMerchantCampaignsList() {
  fetchMerchantCampaigns().then(function(r) {
    var pg = document.getElementById("pg-mc");
    if (!pg) return;
    var skel = pg.querySelector(".skel");
    if (skel) skel.remove();
    var h = '<div class="f fc g2">';
    r.campaigns.forEach(function(c) {
      var pct = Math.min(((c.approved_posts || 0) / (c.total_posts_allowed || 1)) * 100, 100);
      h += '<div class="card"><div class="f jb ai mb2"><div class="fs t13">' + esc(c.title) + '</div><span class="badge ' + (c.status === "active" ? "b-ok" : "b-warn") + '">' + c.status + '</span></div>';
      h += '<div class="c-dim t11 mb2">' + money(c.per_post_value) + '/post \u00B7 ' + (c.approved_posts || 0) + '/' + (c.total_posts_allowed || 0) + '</div>';
      h += '<div class="prog mb2"><div class="prog-bar" style="width:' + pct + '%"></div></div>';
      h += '<div class="f g2"><button class="btn btn-sec btn-sm f1" onclick="S.validateCampaignId=\'' + c.id + '\';go(\'#/merchant/validations\')">Validar</button>';
      h += '<button class="btn btn-ghost btn-sm f1" onclick="toggleCamp(\'' + c.id + '\',\'' + c.status + '\')">' + (c.status === "active" ? "Pausar" : "Ativar") + '</button></div></div>';
    });
    if (r.campaigns.length === 0) h += '<div class="tc" style="padding:40px"><div style="font-size:40px">\uD83D\uDCCB</div><p class="c-dim t13 mt2">Nenhuma campanha</p></div>';
    h += '</div><div style="height:20px"></div>';
    pg.insertAdjacentHTML("beforeend", h);
  });
}

function toggleCamp(id, status) {
  var ns = status === "active" ? "paused" : "active";
  sb.from("campaigns").update({ status: ns }).eq("id", id).then(function() {
    toast("Campanha " + (ns === "active" ? "ativada" : "pausada") + "!");
    loadMerchantCampaignsList();
  });
}

// ======================== SHARE ========================
function shareCampaign() {
  if (navigator.share) {
    navigator.share({ title: "Glow", text: "Olhe esta campanha no Glow!", url: location.href });
  } else {
    navigator.clipboard.writeText(location.href);
    toast("Link copiado!");
  }
}

// ======================== RENDER ========================
function render() {
  var app = document.getElementById("app");
  var hash = location.hash || "#/";

  if (!sb) {
    app.innerHTML = renderSetup();
    return;
  }

  if (!S.user && hash !== "#/login") {
    sb.auth.getSession().then(function(r) {
      if (r.data && r.data.session && r.data.session.user) {
        S.user = r.data.session.user;
        fetchProfile().then(function() {
          if (!S.profile || !S.profile.name) {
            S.step = 3;
            app.innerHTML = renderLogin();
          } else {
            renderRoute(hash);
          }
        });
      } else {
        app.innerHTML = renderLogin();
      }
    });
    return;
  }

  if (hash === "#/login") {
    app.innerHTML = renderLogin();
  } else {
    renderRoute(hash);
  }
}

function renderRoute(hash) {
  var app = document.getElementById("app");

  if (hash === "#/" || hash === "") {
    app.innerHTML = renderFeed();
    fetchCampaigns().then(function(list) {
      var c = document.getElementById("list-campaigns");
      if (!c) return;
      c.innerHTML = list.length
        ? list.map(campaignCard).join("")
        : '<div class="tc" style="padding:40px"><div style="font-size:40px">\uD83D\uDD0D</div><p class="c-dim t13 mt2">Nenhuma campanha</p></div>';
    });
    var si = document.getElementById("in-search");
    if (si) {
      var searchTimer;
      si.addEventListener("input", function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function() {
          fetchCampaigns(si.value).then(function(list) {
            var c = document.getElementById("list-campaigns");
            if (!c) return;
            c.innerHTML = list.length
              ? list.map(campaignCard).join("")
              : '<div class="tc" style="padding:40px"><div style="font-size:40px">\uD83D\uDD0D</div><p class="c-dim t13 mt2">Nenhuma campanha</p></div>';
          });
        }, 300);
      });
    }
  } else if (hash.indexOf("#/campaign/") === 0) {
    var id = hash.split("/")[2];
    app.innerHTML = renderCampaignPage(id);
    loadCampaign(id);
  } else if (hash === "#/wallet") {
    app.innerHTML = renderWallet();
    loadWallet();
  } else if (hash === "#/ranking") {
    app.innerHTML = renderRanking();
    loadRanking();
  } else if (hash === "#/profile") {
    app.innerHTML = renderProfile();
  } else if (hash === "#/my-posts") {
    app.innerHTML = renderMyPosts();
    loadMyPosts();
  } else if (hash === "#/notifications") {
    app.innerHTML = renderNotifications();
    loadNotif();
  } else if (hash === "#/merchant") {
    app.innerHTML = renderMerchant();
    loadMerchant();
  } else if (hash === "#/merchant/register") {
    app.innerHTML = renderMerchantReg();
  } else if (hash === "#/merchant/campaigns") {
    app.innerHTML = renderMerchantCampaignsList();
    loadMerchantCampaignsList();
  } else if (hash === "#/merchant/campaigns/new") {
    app.innerHTML = renderCreateCampaign();
    var vi = document.getElementById("ca-value");
    var ti = document.getElementById("ca-total");
    function updCost() {
      var v = parseFloat((vi && vi.value) || 0);
      var t = parseInt((ti && ti.value) || 0);
      var ce = document.getElementById("ca-cost");
      var pe = document.getElementById("ca-per");
      if (ce) ce.textContent = money(v * t);
      if (pe) pe.textContent = money(v);
    }
    if (vi) vi.addEventListener("input", updCost);
    if (ti) ti.addEventListener("input", updCost);
  } else if (hash === "#/merchant/validations") {
    app.innerHTML = renderValidations();
    loadValidations();
  } else {
    location.hash = "#/";
  }
}

// ======================== EVENTS ========================
document.addEventListener("input", function(e) {
  if (e.target.id === "in-code") {
    e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
  }
});

document.addEventListener("click", function(e) {
  if (e.target.classList.contains("ov")) e.target.remove();
});

// ======================== BOOT ========================
window.addEventListener("hashchange", function() { render(); });

function boot() {
  var isConfigured = SUPABASE_URL.indexOf("SEU_") === -1 && SUPABASE_KEY.indexOf("SUA_") === -1;

  if (typeof supabase !== "undefined" && supabase.createClient && isConfigured) {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    sb.auth.onAuthStateChange(function(event, session) {
      if (event === "SIGNED_IN" && session && session.user) {
        S.user = session.user;
        if (!S.profile) fetchProfile();
      }
      if (event === "SIGNED_OUT") {
        S.user = null;
        S.profile = null;
        S.step = 1;
        location.hash = "#/login";
        render();
      }
    });

    loadSession().then(function() { render(); });
  } else {
    render();
  }
}

if (typeof supabase !== "undefined") {
  boot();
} else {
  window.addEventListener("load", boot);
}
</script>
